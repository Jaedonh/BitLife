name: CI

on:
  push:
    branches: ["**", "!gh-pages"]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, web export, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Scripted playthrough against the web export
        run: node e2e/playthrough.mjs
      - name: Life screen journal, toasts and profile checks
        run: node e2e/life-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
