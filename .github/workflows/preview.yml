name: Web preview

# Builds the playable web version and publishes it to the gh-pages branch.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root). The game is then at https://<owner>.github.io/<repo>/
on:
  push:
    branches: [master, claude/bitlife-clone-mvp-8ogicm]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish the web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web build under /<repo>/
        run: npm run build:pages
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Play through the preview under its subpath before publishing
        run: node e2e/playthrough.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish to the gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web preview of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Preview link
        run: echo "Preview -> https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
